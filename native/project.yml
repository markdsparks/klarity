# Source of truth for the native app's Xcode project (ADR-007). Generate with `npm run native:gen`.
name: Klarity
options:
  bundleIdPrefix: com.klarity
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  KlarityCore:
    path: ../swift/KlarityCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 22PRZ6YK2P
    CODE_SIGN_STYLE: Automatic
targets:
  Klarity:
    type: application
    platform: iOS
    sources:
      - Klarity
    dependencies:
      - package: KlarityCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    info:
      path: Klarity/Info.plist
      properties:
        CFBundleDisplayName: Klarity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Klarity needs your camera to scan food barcodes.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        USDAApiKey: $(USDA_API_KEY)
        KrogerTokenProxyURL: $(KROGER_TOKEN_PROXY_URL)
    settings:
      base:
        # Separate from the RN app (com.klarity.app) until cutover — spec 024 Phase 3.
        PRODUCT_BUNDLE_IDENTIFIER: com.klarity.app.native
        MARKETING_VERSION: 0.2.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
